{% extends "base.html" %}
{% block title %}归档 - {{ site.title }}{% endblock %}
{% block content %}
<div class="wrap doc">
<h1>归档</h1>
{% for g in groups %}
<h2>{{ g.ym }}</h2>
<ul class="list">
{% for p in g.pages %}
<li><a href="/{{ p.url }}">{{ p.title }}</a><span class="date">{{ p.date }}</span></li>
{% endfor %}
</ul>
{% endfor %}
</div>
{% endblock %}
