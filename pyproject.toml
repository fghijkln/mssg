[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mssg"
version = "0.1.0"
description = "极简零依赖静态站点生成器（自研 Markdown 解析器与模板引擎）"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

[project.scripts]
mssg = "mssg.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["mssg*"]
