[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mssg"
version = "0.8.0"
description = "轻量静态站点生成器：Markdown + 配置 → 公司官网级网站"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "Markdown>=3.7",
    "Jinja2>=3.1",
    "Pygments>=2.18",
    "PyYAML>=6.0",
    "Pillow>=10.0",
]

[project.scripts]
mssg = "mssg.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["mssg*"]

[tool.setuptools.package-data]
mssg = ["themes/**/*"]
